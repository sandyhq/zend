name: zgx tests

# Called by ci.yml (the `zgx` suite, scripts/ci/plan.py) when apps/zgx or a
# crate it or the engine's plugin host builds changes.
#
#   apps/zgx's unit tests (`cargo test --bin zend-zgx`: src/plugins/*_tests.rs
#   among them) and its Luau UI tests (`zgx test ui`, the zgx CLI built from
#   sandyhq/zengx at the commit apps/zgx builds against), on Linux, the known failures let through
#   (scripts/ci/test-zgx.sh, scripts/ci/zgx-known-failures.txt). The engine's
#   plugin tests run in core-tests.
#
# Linux only: this fork ships the Linux build. (The macOS job was dropped with
# the other macOS suites; it had never got past installing the zgx CLI.)
on:
  workflow_call:
    inputs:
      pass-key:
        description: Cache key prefix under which each job records its pass (ci.yml); empty records nothing.
        type: string
        default: ''

permissions:
  contents: read

env:
  NEXTEST_PROFILE: ${{ github.event_name == 'schedule' && 'default' || 'ci' }}
  CARGO_PROFILE_DEV_DEBUG: 0
  # The zgx CLI without Luau's asserts (they slow scripts by about a fifth).
  LUAU_CXXFLAGS: -DNDEBUG

jobs:
  zgx-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: System packages
        run: >-
          bash scripts/ci/apt-install.sh
          libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-dev libxcb1-dev
          libx11-xcb-dev libfontconfig1-dev libfreetype-dev libasound2-dev libvulkan-dev
          pkg-config cmake libwebkit2gtk-4.1-dev libjson-glib-dev
          mesa-vulkan-drivers
      # (mesa-vulkan-drivers: lavapipe, a Vulkan device on the CPU, so agent
      # visuals' shaders and scenes render here as on a machine with a GPU;
      # src/visuals_tests.rs. The runner has none of its own.)
      - name: Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: zgx-tests
          workspaces: apps/zgx -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      # The zgx CLI at the sandyhq/zengx commit the app builds against (its
      # one pin, apps/zgx/Cargo.lock), so the UI tests run the zgx they ship.
      - name: Which zengx
        run: |
          rev=$(sed -n 's|^source = "git+https://github.com/sandyhq/zengx?rev=[0-9a-f]*#\([0-9a-f]*\)"$|\1|p' apps/zgx/Cargo.lock | sort -u)
          [ "$(printf '%s\n' "$rev" | grep -c .)" = 1 ] || { echo "apps/zgx/Cargo.lock: want one sandyhq/zengx commit, found: $rev"; exit 1; }
          echo "ZENGX_REV=$rev" >> "$GITHUB_ENV"
      - id: zgx-cli
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/zgx-cli
          key: zgx-cli-${{ runner.os }}-${{ runner.arch }}-${{ env.ZENGX_REV }}
      - name: zgx CLI (sandyhq/zengx)
        if: steps.zgx-cli.outputs.cache-hit != 'true'
        run: |
          CARGO_TARGET_DIR="$RUNNER_TEMP/zgx-cli-target" cargo install --locked \
            --git https://github.com/sandyhq/zengx --rev "$ZENGX_REV" \
            zgx-script --bin zgx --features inspect --root ~/zgx-cli
      - name: apps/zgx unit tests
        run: scripts/ci/test-zgx.sh rust
      - name: apps/zgx Luau UI tests
        if: ${{ !cancelled() }}
        run: scripts/ci/test-zgx.sh ui ~/zgx-cli/bin/zgx
      - name: Record the pass (CI skips this job while its inputs stay the same)
        if: inputs.pass-key != ''
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: rust-toolchain.toml
          key: ${{ inputs.pass-key }}-zgx-linux
