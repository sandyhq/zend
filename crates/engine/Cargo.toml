[package]
name = "zend-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
zend-launch.workspace = true
# Host-side answers to terminal queries (terminals/replies.rs).
alacritty_terminal.workspace = true
zend-preview.workspace = true
zend-proto.workspace = true
zend-theme.workspace = true
zend-doc.workspace = true
zend-sync.workspace = true
zend-harness.workspace = true
semver = "1"
zend-rpc.workspace = true
zend-update.workspace = true
zend-notify.workspace = true
zend-visual.workspace = true
# Plugin services (plugins/service): a headless Luau VM per plugin, the
# same mlua and Luau zend-visual already links (no new crate).
mlua = { version = "0.12", features = ["luau"] }
loro.workspace = true
tokio.workspace = true
futures.workspace = true
zend-term-link.workspace = true
async-trait.workspace = true
# Agents' Zend MCP tools, served by the engine itself (`zend_mcp::http`).
zend-mcp.workspace = true
serde.workspace = true
serde_json.workspace = true
rusqlite.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
uuid.workspace = true
chrono.workspace = true
notify.workspace = true
portable-pty.workspace = true
base64 = "0.22"
# Cloud runner identity: Ed25519 device key (already in the tree via rustls).
ring = "0.17"
toml = "0.8"
libc.workspace = true
gethostname.workspace = true
tokio-util = { workspace = true, features = ["rt"] }
sha2.workspace = true
reqwest.workspace = true
# A large chat2 checkpoint sent in parts, sliced from one buffer.
bytes = "1"
# The rules plugins are held to (paths, programs, network), shared with apps/zgx.
zend-plugin-guard.workspace = true
ignore.workspace = true
fff-search.workspace = true

same-file = "1"
tempfile.workspace = true
# `show_image` reads a shown image's size from its header (already in the
# tree with these decoders via zend-ui).
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
# `DeviceStats` (device_stats.rs): OS, CPU, memory and volumes from OS APIs.
# Already in the tree (zed-scap, through the app); only its system and disk
# parts here, no threads pool.
sysinfo = { version = "0.31.4", default-features = false, features = ["system", "disk"] }
# The pinned luau-lsp release a plugin check fetches (plugins/check/fetch.rs).
zip.workspace = true

[target.'cfg(unix)'.dependencies]
# A shared project's files opened beneath its folder's fd (openat2 on
# Linux), never by a path checked first (peer_files.rs). Already in the
# tree (portable-pty, tempfile).
rustix = { version = "1.1.4", features = ["fs"] }

[target.'cfg(target_os = "macos")'.dependencies]
# The battery's IOKit power-source dictionary (device_stats.rs); already in the tree.
core-foundation = "0.10"

[target.'cfg(windows)'.dependencies]
dunce = "1"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_System_Power", "Win32_System_Threading"] }

[dev-dependencies]
tracing-subscriber.workspace = true
zend-harness = { workspace = true, features = ["installer-fixture"] }
# Paused-clock tests (the 30-minute idle reaper).
tokio = { workspace = true, features = ["test-util"] }
tokio-tungstenite.workspace = true
# A registry build of the fake ACP agent (tests/acp_registry_rpc.rs).
tar = "0.4"
flate2 = "1"
# In-process registry server for the two-engine workspace integration tests.
zend-sync = { workspace = true, features = ["mock-server"] }
