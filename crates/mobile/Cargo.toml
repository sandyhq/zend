[package]
name = "zend-mobile"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# The mobile core: one UniFFI library that iOS (Swift) and Android (Kotlin)
# link. Platform code paints, scrolls and handles gestures; everything that
# decides *what* to paint and *where* lives here.
[lib]
name = "zend_mobile"
crate-type = ["lib", "staticlib", "cdylib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["bindgen"]

[features]
bindgen = ["uniffi/cli"]

[dependencies]
zend-voice-session.workspace = true
zend-orb.workspace = true
zend-veil.workspace = true
tokio.workspace = true
tokio-util.workspace = true
async-trait.workspace = true
uniffi = "0.32"
zend-markdown.workspace = true
zend-text.workspace = true
zend-visual.workspace = true
zend-visual-gpu.workspace = true
zend-doc.workspace = true
zend-proto.workspace = true
zend-client.workspace = true
serde.workspace = true
serde_json.workspace = true
similar.workspace = true
zend-syntax.workspace = true
zatex = { workspace = true, features = ["bundled"] }
thiserror.workspace = true
zend-term.workspace = true
