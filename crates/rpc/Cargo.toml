[package]
name = "zend-rpc"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
zend-proto.workspace = true
zend-sync.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
thiserror.workspace = true
async-trait.workspace = true
tracing.workspace = true
uuid.workspace = true
# OS CSPRNG for the localhost IPC bearer (already in the tree via uuid).
getrandom = "0.4"
# The phone link's challenge (src/link_proof.rs): both already in the tree.
hmac = "0.12"
sha2.workspace = true
# Servers' node keys (src/peer_link.rs): Ed25519, already in the tree
# (zend-engine signs plugins and the Cloud runner's identity with it).
ring = "0.17"
# A worker's socket opened O_PATH | O_NOFOLLOW (src/peer_link.rs): already in the tree.
libc.workspace = true

[dev-dependencies]
zend-doc.workspace = true
tempfile.workspace = true

# Deterministic stalled-transport deadlines.
tokio = { workspace = true, features = ["test-util"] }
